image:
  repository: segelfartyg/fiskekartan
  tag: latest
  pullPolicy: Always

# Secret-backed values — left empty here; the HelmRelease's `valuesFrom`
# injects the real values from an out-of-band Kubernetes Secret at release
# time. Never set real credentials in this file.
databaseUrl: ""
minioEndpoint: ""
minioAccessKey: ""
minioSecretKey: ""
# Signs catch photo URLs (any long random string, e.g. `openssl rand -hex 32`).
# Optional: empty means a random key per start, which breaks photo links
# clients already hold on every restart.
catchPhotoSigningKey: ""

# Non-secret config, passed straight through as env vars.
minioBucket: "fiskekartan-images"
minioUseSSL: "false"
oidcIssuerUrl: ""
oidcAudience: "fiskekartan"

service:
  port: 8080

resources: {}
