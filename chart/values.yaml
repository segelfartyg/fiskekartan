image:
  repository: segelfartyg/fiskekartan
  tag: latest
  pullPolicy: Always

# Secret-backed values — left empty here; the HelmRelease's `valuesFrom`
# injects the real values from an out-of-band Kubernetes Secret at release
# time. Never set real credentials in this file.
databaseUrl: ""
minioEndpoint: ""
minioAccessKey: ""
minioSecretKey: ""

# Non-secret config, passed straight through as env vars.
minioBucket: "fiskekartan-images"
minioUseSSL: "false"
oidcIssuerUrl: ""
oidcAudience: "fiskekartan"

service:
  port: 8080

resources: {}
